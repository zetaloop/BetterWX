[package]
name = "betterwx"
version = "2.1.1"
edition = "2024"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
warnings = "deny"

[dependencies]
crossterm = { version = "0.29.0", default-features = false, features = ["events", "windows"] }
exarmo-aarch64 = "0.4.0"
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "decoder", "fast_fmt", "code_asm", "instr_info"] }
memchr = "2.8.3"
object = { version = "0.40.0", default-features = false, features = ["read_core", "pe", "std", "macho"] }
rustc-hash = "2.1.3"
tempfile = "3.27.0"
unicode-width = "0.2.2"

[target."cfg(windows)".dependencies]
wfd = "0.1.8"
windows = { version = "0.62.2", features = ["ApplicationModel", "Foundation", "Management_Deployment", "System", "Win32_Graphics_Imaging", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Security_WinTrust", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_RestartManager", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56.0"

[build-dependencies]
winresource = { version = "0.1.34", default-features = false }
